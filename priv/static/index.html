<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix SSE</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }

    #contador {
      font-size: 64px;
      margin: 24px 0;
    }

    #eventos {
      padding: 16px;
      background: #222;
      color: #a7f3d0;
      height: 240px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Eventos do Phoenix</h1>
  <p>Status: <strong id="status">Desconectado</strong></p>

  <button id="conectar">Conectar</button>
  <button id="desconectar" disabled>Desconectar</button>

  <div id="contador">—</div>
  <pre id="eventos" aria-live="polite"></pre>

  <script>
    const status = document.querySelector("#status");
    const contador = document.querySelector("#contador");
    const eventos = document.querySelector("#eventos");
    const conectar = document.querySelector("#conectar");
    const desconectar = document.querySelector("#desconectar");

    let stream = null;

    function registrar(mensagem) {
      const horario = new Date().toLocaleTimeString();
      const linhas = eventos.textContent.split("\n").filter(Boolean);

      linhas.push(`[${horario}] ${mensagem}`);
      eventos.textContent = linhas.slice(-100).join("\n") + "\n";
      eventos.scrollTop = eventos.scrollHeight;
    }

    conectar.addEventListener("click", () => {
      if (stream) return;

      status.textContent = "Conectando...";
      conectar.disabled = true;
      desconectar.disabled = false;

      stream = new EventSource("/events");

      stream.onopen = () => {
        status.textContent = "Conectado";
        registrar("Conexão aberta");
      };

      stream.addEventListener("contador", (evento) => {
        const dados = JSON.parse(evento.data);

        contador.textContent = dados.valor;
        registrar(`Recebido: ${evento.data}`);
      });

      stream.onerror = () => {
        status.textContent = "Conexão interrompida";
        registrar("Falha na conexão; aguardando reconexão");
      };
    });

    desconectar.addEventListener("click", () => {
      stream?.close();
      stream = null;

      status.textContent = "Desconectado";
      conectar.disabled = false;
      desconectar.disabled = true;

      registrar("Conexão encerrada pelo usuário");
    });
  </script>
</body>
</html>
